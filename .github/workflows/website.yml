name: Validate approved website batch

# Manual only: new builds and deployments require the owner's approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm --prefix api ci
      - run: npm run build
      - run: npm run build:modports
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: modports-public-website
          path: dist-modports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
